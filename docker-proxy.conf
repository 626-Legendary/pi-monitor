# This service alone can access the host Docker socket.
# No TCP listener: the application connects through a shared Unix socket.
# Single process avoids setuid/setgid capabilities for worker initialization.
user root;
master_process off;
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 64; }
http {
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server {
        listen unix:/run/docker-proxy/docker.sock;
        server_tokens off;
        # Reject every method except GET, including HEAD and all writes.
        if ($request_method != GET) { return 403; }
        # Match the original request target too, preventing normalized/encoded
        # paths from broadening the whitelist.
        if ($request_uri !~ "^(/v[0-9]+\.[0-9]+)?/(version|containers/json|containers/[a-f0-9]{12,64}/json)(\?.*)?$") {
            return 403;
        }
        location / {
            proxy_pass http://unix:/var/run/docker.sock;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host localhost;
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
            proxy_buffering off;
        }
    }
}
